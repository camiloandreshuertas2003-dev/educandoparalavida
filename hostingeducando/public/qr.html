<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vincular WhatsApp por Código QR - Colegio Virtual</title>
  <style>
    :root {
      --primary: #10B981;
      --dark: #0F172A;
      --card-bg: #1E293B;
      --text: #F8FAFC;
      --danger: #EF4444;
    }
    body {
      background-color: var(--dark);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      border: 1px solid #334155;
    }
    h1 {
      color: var(--primary);
      margin-top: 0;
      font-size: 1.6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .qr-container {
      background: white;
      padding: 16px;
      border-radius: 12px;
      display: inline-block;
      margin: 20px 0;
      min-width: 240px;
      min-height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qr-container img {
      width: 240px;
      height: 240px;
      display: block;
    }
    .status-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 12px;
    }
    .status-disconnected { background-color: #EF4444; color: white; }
    .status-qr_ready { background-color: #F59E0B; color: black; }
    .status-authenticated { background-color: #3B82F6; color: white; }
    .status-ready { background-color: #10B981; color: white; }
    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
      margin: 4px;
    }
    .btn:hover { background-color: #059669; }
    .btn-danger { background-color: var(--danger); }
    .btn-danger:hover { background-color: #DC2626; }
    ol {
      text-align: left;
      line-height: 1.8;
      color: #94A3B8;
      font-size: 0.95rem;
      padding-left: 24px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>📱 Estado WhatsApp Web</h1>
    <p style="color: #94A3B8; margin-bottom: 20px;">Colegio Virtual Educando para la Vida</p>
    
    <div id="statusBadge" class="status-badge status-disconnected">Cargando estado...</div>
    
    <div class="qr-container" id="qrBox">
      <p style="color: #475569;">Cargando código QR...</p>
    </div>

    <div id="instructions">
      <ol>
        <li>Abre <strong>WhatsApp</strong> en tu celular.</li>
        <li>Toca en <strong>Menú (⋮)</strong> o <strong>Configuración (⚙️)</strong>.</li>
        <li>Selecciona <strong>Dispositivos vinculados</strong> ➡️ <strong>Vincular un dispositivo</strong>.</li>
        <li>Apunta tu cámara hacia este código QR.</li>
      </ol>
    </div>

    <div style="margin-top: 15px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">
      <button class="btn" onclick="iniciarConexion()">🔄 Generar / Reiniciar QR</button>
      <button class="btn btn-danger" id="btnLogout" onclick="cerrarSesion()" style="display: none;">🔴 Cerrar Sesión WhatsApp</button>
    </div>
  </div>

  <script>
    function getApiUrl(endpoint) {
      const path = window.location.pathname;
      const subfolder = path.replace(/\/+(qr|index\.html|panel|admin).*$/i, '');
      const cleanBase = subfolder.endsWith('/') ? subfolder.slice(0, -1) : subfolder;
      const cleanEndpoint = endpoint.startsWith('/') ? endpoint : '/' + endpoint;
      return cleanBase + cleanEndpoint;
    }

    async function checkStatus() {
      try {
        const res = await fetch(getApiUrl('/api/admin/qr-status'));
        const data = await res.json();
        
        const badge = document.getElementById('statusBadge');
        const qrBox = document.getElementById('qrBox');
        const btnLogout = document.getElementById('btnLogout');

        badge.className = 'status-badge status-' + data.status;
        
        if (data.status === 'ready') {
          badge.textContent = '🟢 Conectado 100% (+' + (data.userProfile?.phone || '') + ')';
          qrBox.innerHTML = '<div style="color: #10B981; font-weight: bold; font-size: 1.2rem;">✨ ¡WhatsApp Vinculado con Éxito!<br><span style="font-size: 0.9rem; color: #475569;">Tu número está respondiendo automáticamente las 24 Horas</span></div>';
          btnLogout.style.display = 'inline-block';
        } else if (data.status === 'qr_ready' && data.qrDataUri) {
          badge.textContent = '🟡 Listo para Escanear Código QR';
          qrBox.innerHTML = '<img src="' + data.qrDataUri + '" alt="WhatsApp QR Code" />';
          btnLogout.style.display = 'none';
        } else if (data.status === 'initializing') {
          badge.textContent = '⏳ Inicializando navegador Puppeteer...';
          qrBox.innerHTML = '<p style="color: #475569;">Abriendo sesión de WhatsApp Web...</p>';
          btnLogout.style.display = 'none';
        } else {
          badge.textContent = '🔴 Desconectado';
          qrBox.innerHTML = '<p style="color: #475569;">Presiona "Generar / Reiniciar QR" para comenzar</p>';
          btnLogout.style.display = 'none';
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function iniciarConexion() {
      try {
        await fetch(getApiUrl('/api/admin/qr-init'), { method: 'POST' });
        checkStatus();
      } catch (e) {
        alert('Error al conectar');
      }
    }

    async function cerrarSesion() {
      if (confirm('¿Estás seguro de que deseas cerrar la sesión de WhatsApp Web y desvincular el número?')) {
        try {
          await fetch(getApiUrl('/api/admin/qr-logout'), { method: 'POST' });
          checkStatus();
        } catch (e) {
          alert('Error al cerrar sesión');
        }
      }
    }

    setInterval(checkStatus, 3000);
    checkStatus();
  </script>
</body>
</html>
